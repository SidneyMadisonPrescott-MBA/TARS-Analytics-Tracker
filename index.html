<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZionGPT KPI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080d;
  --bg2: #0d0f16;
  --panel: rgba(17,19,28,0.85);
  --panel-solid: #11131c;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --fg: #eaedf3;
  --fg2: #9ba1b4;
  --fg3: #5c6178;
  --ok: #22d3a7;
  --ok-bg: rgba(34,211,167,0.1);
  --warn: #f5a623;
  --warn-bg: rgba(245,166,35,0.1);
  --bad: #ef5b5b;
  --bad-bg: rgba(239,91,91,0.1);
  --accent: #7c6aef;
  --accent2: #5b8def;
  --accent-bg: rgba(124,106,239,0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.25);
  --c0: #7c6aef;
  --c1: #22d3a7;
  --c2: #ef5b5b;
  --c3: #f5a623;
  --c4: #e06abe;
  --c5: #3ba4f5;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: 'Inter', -apple-system, sans-serif; line-height: 1.5; min-height: 100vh; }
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 500px; background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(124,106,239,0.12) 0%, transparent 70%); pointer-events: none; z-index: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 32px 24px; position: relative; z-index: 1; }

/* Header */
.header { margin-bottom: 32px; }
.header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, var(--fg) 0%, var(--fg2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header .sub { color: var(--fg3); font-size: 14px; font-weight: 500; margin-top: 4px; letter-spacing: 0.5px; text-transform: uppercase; }

/* Takeaway banner */
.banner { background: linear-gradient(135deg, rgba(124,106,239,0.08) 0%, rgba(91,141,239,0.06) 100%); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 28px; font-size: 14px; color: var(--fg2); line-height: 1.6; backdrop-filter: blur(12px); }

/* Tabs */
.tabs { display: flex; gap: 2px; background: var(--panel-solid); border-radius: 10px; padding: 3px; margin-bottom: 28px; border: 1px solid var(--border); width: fit-content; }
.tab { padding: 8px 18px; font-size: 13px; font-weight: 600; color: var(--fg3); cursor: pointer; border-radius: 8px; transition: all 0.25s ease; user-select: none; }
.tab:hover { color: var(--fg2); }
.tab.active { color: var(--fg); background: rgba(124,106,239,0.15); box-shadow: 0 1px 4px rgba(124,106,239,0.2); }
.tab-content { display: none; animation: fadeIn 0.3s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* KPI Grid */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
.kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; backdrop-filter: blur(12px); transition: border-color 0.2s, transform 0.2s; }
.kpi:hover { border-color: var(--border-hover); transform: translateY(-1px); }
.kpi-label { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; }
.kpi-val { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 500; letter-spacing: -1px; }
.kpi-change { font-size: 12px; font-weight: 600; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; }
.up { color: var(--ok); background: var(--ok-bg); }
.down { color: var(--bad); background: var(--bad-bg); }
.flat { color: var(--fg3); }
.kpi-target { font-size: 11px; color: var(--fg3); margin-top: 6px; }
.kpi-accent .kpi-val { color: var(--accent); }

/* Chart cards */
.section-title { font-size: 16px; font-weight: 700; margin: 28px 0 14px; color: var(--fg2); letter-spacing: -0.2px; }
.chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 18px; backdrop-filter: blur(12px); }
.chart-label { font-size: 12px; color: var(--fg3); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
.chart-area { position: relative; min-height: 280px; }
svg text { font-family: 'Inter', sans-serif; }
.tooltip { position: absolute; pointer-events: none; background: var(--panel-solid); border: 1px solid var(--border-hover); border-radius: 10px; padding: 10px 14px; font-size: 12px; box-shadow: var(--shadow); z-index: 10; display: none; line-height: 1.6; backdrop-filter: blur(16px); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); font-weight: 500; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

/* Funnel */
.funnel-step { display: flex; align-items: center; margin-bottom: 10px; }
.funnel-label { width: 140px; text-align: right; padding-right: 16px; font-size: 12px; color: var(--fg2); font-weight: 500; flex-shrink: 0; }
.funnel-bar-wrap { flex: 1; display: flex; justify-content: center; }
.funnel-bar { height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; color: #fff; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); position: relative; }
.funnel-pct { position: absolute; right: -50px; font-size: 11px; color: var(--fg3); font-family: 'Inter', sans-serif; width: 44px; }

/* Table */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; padding: 12px 14px; background: var(--panel-solid); font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(124,106,239,0.04); }
.notes-cell { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Inter', sans-serif; color: var(--fg2); }

/* Topics */
.topic-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.topic-label { font-size: 12px; color: var(--fg2); width: 190px; text-align: right; flex-shrink: 0; font-weight: 500; }
.topic-track { flex: 1; height: 32px; background: rgba(255,255,255,0.03); border-radius: 6px; overflow: hidden; position: relative; }
.topic-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; color: #fff; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); justify-content: space-between; min-width: 50px; }
.topic-pct { font-size: 10px; opacity: 0.7; font-weight: 500; }

/* Form */
.form-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 24px; backdrop-filter: blur(12px); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 14px; }
.field label { display: block; font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 6px; }
.field input, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg2); color: var(--fg); font-size: 14px; font-family: 'JetBrains Mono', monospace; transition: border-color 0.2s; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,239,0.15); }
.field textarea { min-height: 70px; resize: vertical; font-family: 'Inter', sans-serif; }
.btn-row { margin-top: 20px; display: flex; align-items: center; gap: 14px; }
.btn { padding: 10px 24px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 600; transition: all 0.2s; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 2px 8px rgba(124,106,239,0.3); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,106,239,0.4); }
.save-msg { font-size: 13px; color: var(--ok); font-weight: 500; }

/* Responsive */
@media (max-width: 600px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .tabs { overflow-x: auto; width: 100%; }
  .funnel-label, .topic-label { width: 100px; font-size: 11px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>ZionGPT KPI Dashboard</h1>
    <div class="sub">Zion Church AI Agent Weekly Intelligence Performance Brief</div>
  </div>
  <div class="banner" id="takeaway"></div>

  <div class="tabs">
    <div class="tab active" data-tab="overview">Overview</div>
    <div class="tab" data-tab="trends">Trends</div>
    <div class="tab" data-tab="topics">Topics</div>
    <div class="tab" data-tab="data">All Data</div>
    <div class="tab" data-tab="add">Add Week</div>
  </div>

  <div class="tab-content active" id="tab-overview">
    <div class="kpi-grid" id="kpis"></div>
    <div class="chart-card">
      <div class="chart-label">Conversations &amp; Outcome Rate</div>
      <div class="chart-area" id="chart-main"></div>
      <div class="legend" id="legend-main"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-trends">
    <div class="chart-card">
      <div class="chart-label">Intent Clicks by Week</div>
      <div class="chart-area" id="chart-intents"></div>
      <div class="legend" id="legend-intents"></div>
    </div>
    <div class="chart-card">
      <div class="chart-label">Funnel: Visitors to Outcomes</div>
      <div id="chart-funnel" style="padding: 10px 0;"></div>
    </div>
    <div class="chart-card">
      <div class="chart-label">Rate Tracking</div>
      <div class="chart-area" id="chart-rates"></div>
      <div class="legend" id="legend-rates"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-topics">
    <div class="chart-card">
      <div class="chart-label">Conversation Topics (Latest Week)</div>
      <div id="chart-topics" style="padding: 8px 0;"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-data">
    <div class="table-wrap"><table id="data-table"></table></div>
  </div>

  <div class="tab-content" id="tab-add">
    <div class="form-card">
      <h3 style="margin-bottom:20px; font-size:16px; font-weight:700;">Enter weekly numbers from the Tars email report</h3>
      <div class="form-grid">
        <div class="field"><label>Week start date</label><input type="date" id="f-week"></div>
        <div class="field"><label>Week label</label><input type="text" id="f-label" placeholder="Nov 16-22"></div>
        <div class="field"><label>Visitors</label><input type="number" id="f-visitors" min="0"></div>
        <div class="field"><label>Widget opens</label><input type="number" id="f-widget" min="0"></div>
        <div class="field"><label>Conversations</label><input type="number" id="f-convos" min="0"></div>
        <div class="field"><label>Outcomes</label><input type="number" id="f-outcomes" min="0"></div>
        <div class="field"><label>Sermon clicks</label><input type="number" id="f-sermons" min="0"></div>
        <div class="field"><label>Sermon topics</label><input type="number" id="f-stopics" min="0"></div>
        <div class="field"><label>Life Groups</label><input type="number" id="f-life" min="0"></div>
        <div class="field"><label>Give</label><input type="number" id="f-give" min="0"></div>
        <div class="field"><label>Events</label><input type="number" id="f-events" min="0"></div>
        <div class="field"><label>Visit planning</label><input type="number" id="f-visit" min="0"></div>
        <div class="field"><label>Event info</label><input type="number" id="f-eventinfo" min="0"></div>
        <div class="field"><label>Service time Qs</label><input type="number" id="f-service" min="0"></div>
        <div class="field"><label>Group/ministry Qs</label><input type="number" id="f-group" min="0"></div>
        <div class="field"><label>Staff contact</label><input type="number" id="f-staff" min="0"></div>
        <div class="field"><label>Child attendance</label><input type="number" id="f-child" min="0"></div>
        <div class="field"><label>Helpful: answered</label><input type="number" id="f-helpful-ans" min="0"></div>
        <div class="field"><label>Helpful: asked</label><input type="number" id="f-helpful-ask" min="0"></div>
      </div>
      <div class="field" style="margin-top:14px;"><label>Notes</label><textarea id="f-notes" placeholder="What happened this week"></textarea></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="save-btn">Save Week</button>
        <span class="save-msg" id="save-msg"></span>
      </div>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'tars_tracker_weeks';
function loadWeeks() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }
function saveWeeks(w) { localStorage.setItem(STORE_KEY, JSON.stringify(w)); }
function sorted(w) { return [...w].sort((a, b) => a.week.localeCompare(b.week)); }

// Seed with both baseline weeks
if (!loadWeeks().length) {
  saveWeeks([
    { week:"2026-11-02", week_label:"Nov 2-8", visitors:4819, widget_opens:2142, conversations:418, outcomes:177, sermon_clicks:78, sermon_topics:94, life_groups:32, give:31, events:36, visit_planning:16, event_info:46, service_time:127, group_ministry:49, donation_giving:40, event_registration:23, online_access:29, staff_contact:0, child_attendance:0, helpful_asked:338, helpful_answered:153, volunteer:16, preacher_schedule:14, notes:"Strong week. Conversations +142%, outcomes +177%, widget opens +464% vs prior. Give +520%, Life Groups +146%, Sermons +212%. Busiest: Sunday 8 AM. 100% AI handled." },
    { week:"2026-11-09", week_label:"Nov 9-15", visitors:5348, widget_opens:2978, conversations:370, outcomes:151, sermon_clicks:79, sermon_topics:92, life_groups:22, give:14, events:36, visit_planning:19, event_info:48, service_time:79, group_ministry:45, donation_giving:22, event_registration:15, online_access:13, staff_contact:12, child_attendance:10, helpful_asked:277, helpful_answered:131, notes:"Visitors +11%, widget opens +39%. Conversations -11%, outcomes -15%. Give -55%, Life Groups -31%. Watch sermons top intent at 21%. Nov 15 spike: 2,244 visitors." }
  ]);
}

const v = x => x == null || x === '' ? null : +x;
const fmt = x => x == null ? '—' : x.toLocaleString();
const pct = (a, b) => b ? Math.round((a / b) * 100) : null;
const chg = (c, p) => {
  if (p == null || c == null || p === 0) return { text: '', cls: 'flat' };
  const d = Math.round(((c - p) / p) * 100);
  return d > 0 ? { text: '▲ ' + d + '%', cls: 'up' } : d < 0 ? { text: '▼ ' + Math.abs(d) + '%', cls: 'down' } : { text: '0%', cls: 'flat' };
};
const rc = () => { const s = getComputedStyle(document.documentElement); return ['--c0','--c1','--c2','--c3','--c4','--c5'].map(c => s.getPropertyValue(c).trim()); };

// Tabs
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('tab-' + t.dataset.tab).classList.add('active');
  render();
}));

function render() {
  const weeks = sorted(loadWeeks());
  if (!weeks.length) return;
  const last = weeks[weeks.length - 1];
  const prev = weeks.length > 1 ? weeks[weeks.length - 2] : null;
  const rate = pct(v(last.outcomes), v(last.conversations));
  document.getElementById('takeaway').textContent = last.week_label + ': ' + fmt(v(last.conversations)) + ' conversations, ' + (rate != null ? rate + '% outcome rate' : 'no outcome data') + '. Target: 60%.';
  renderKPIs(last, prev);
  renderMainChart(weeks);
  renderIntentsChart(weeks);
  renderFunnelChart(last);
  renderRatesChart(weeks);
  renderTopics(last);
  renderTable(weeks);
}

function renderKPIs(last, prev) {
  const rate = pct(v(last.outcomes), v(last.conversations));
  const prevRate = prev ? pct(v(prev.outcomes), v(prev.conversations)) : null;
  const woRate = pct(v(last.widget_opens), v(last.visitors));
  const prevWo = prev ? pct(v(prev.widget_opens), v(prev.visitors)) : null;
  const cards = [
    { label:'Visitors', val:fmt(v(last.visitors)), ...chg(v(last.visitors), prev?v(prev.visitors):null) },
    { label:'Widget Opens', val:fmt(v(last.widget_opens)), ...chg(v(last.widget_opens), prev?v(prev.widget_opens):null) },
    { label:'Conversations', val:fmt(v(last.conversations)), ...chg(v(last.conversations), prev?v(prev.conversations):null) },
    { label:'Outcome Rate', val:rate!=null?rate+'%':'—', ...chg(rate, prevRate), target:'Target: 60%', accent:true },
    { label:'Widget Open Rate', val:woRate!=null?woRate+'%':'—', ...chg(woRate, prevWo), target:'Target: >50%' },
    { label:'Sermon Clicks', val:fmt(v(last.sermon_clicks)), ...chg(v(last.sermon_clicks), prev?v(prev.sermon_clicks):null) },
    { label:'Life Groups', val:fmt(v(last.life_groups)), ...chg(v(last.life_groups), prev?v(prev.life_groups):null) },
    { label:'Give', val:fmt(v(last.give)), ...chg(v(last.give), prev?v(prev.give):null) },
  ];
  document.getElementById('kpis').innerHTML = cards.map(c => `
    <div class="kpi${c.accent?' kpi-accent':''}">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-val">${c.val}</div>
      ${c.text ? `<div class="kpi-change ${c.cls}">${c.text}</div>` : ''}
      ${c.target ? `<div class="kpi-target">${c.target}</div>` : ''}
    </div>`).join('');
}

function renderMainChart(weeks) {
  const el = document.getElementById('chart-main'); el.innerHTML = '';
  const c = rc(), w = el.clientWidth || 700, h = 300;
  const m = { top: 35, right: 65, bottom: 50, left: 55 };
  const svg = d3.select(el).append('svg').attr('width', w).attr('height', h);
  const maxBW = 80;
  const x = d3.scaleBand().domain(weeks.map(r => r.week_label)).range([m.left, w - m.right]).padding(weeks.length < 4 ? 0.6 : 0.3);
  const bw = Math.min(x.bandwidth(), maxBW), bOff = (x.bandwidth() - bw) / 2;
  const yB = d3.scaleLinear().domain([0, d3.max(weeks, r => v(r.conversations)) * 1.35]).range([h - m.bottom, m.top]);
  const yL = d3.scaleLinear().domain([0, 100]).range([h - m.bottom, m.top]);

  // Grid
  yB.ticks(5).forEach(t => svg.append('line').attr('x1',m.left).attr('x2',w-m.right).attr('y1',yB(t)).attr('y2',yB(t)).attr('stroke','var(--border)'));

  svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x).tickSize(0)).selectAll('text').attr('fill','var(--fg3)').style('font-size','12px').style('font-weight','500');
  svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(yB).ticks(5).tickFormat(d3.format(','))).selectAll('text').attr('fill','var(--fg3)').style('font-size','11px');
  svg.append('g').attr('transform',`translate(${w-m.right},0)`).call(d3.axisRight(yL).ticks(5).tickFormat(d=>d+'%')).selectAll('text').attr('fill','var(--fg3)').style('font-size','11px');
  svg.selectAll('.domain').remove();
  svg.selectAll('.tick line').attr('stroke','var(--border)');

  // Gradient for bars
  const defs = svg.append('defs');
  const grad = defs.append('linearGradient').attr('id','barGrad').attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1');
  grad.append('stop').attr('offset','0%').attr('stop-color',c[0]).attr('stop-opacity',0.9);
  grad.append('stop').attr('offset','100%').attr('stop-color',c[0]).attr('stop-opacity',0.5);

  svg.selectAll('.bar').data(weeks).join('rect').attr('x',d=>x(d.week_label)+bOff).attr('y',d=>yB(v(d.conversations)||0)).attr('width',bw).attr('height',d=>h-m.bottom-yB(v(d.conversations)||0)).attr('fill','url(#barGrad)').attr('rx',5);
  // Value labels
  svg.selectAll('.blbl').data(weeks).join('text').attr('x',d=>x(d.week_label)+x.bandwidth()/2).attr('y',d=>yB(v(d.conversations)||0)-10).attr('text-anchor','middle').attr('fill',c[0]).style('font-size','12px').style('font-weight','700').style('font-family','JetBrains Mono, monospace').text(d=>fmt(v(d.conversations)));

  // Target
  svg.append('line').attr('x1',m.left).attr('x2',w-m.right).attr('y1',yL(60)).attr('y2',yL(60)).attr('stroke','var(--warn)').attr('stroke-dasharray','8,4').attr('stroke-width',1.5).attr('opacity',0.7);
  svg.append('text').attr('x',w-m.right+4).attr('y',yL(60)+4).text('60%').attr('fill','var(--warn)').style('font-size','11px').style('font-weight','600');

  // Rate line
  if (weeks.length > 1) {
    const ln = d3.line().x(d=>x(d.week_label)+x.bandwidth()/2).y(d=>yL(pct(v(d.outcomes),v(d.conversations))||0));
    svg.append('path').datum(weeks).attr('d',ln).attr('fill','none').attr('stroke',c[1]).attr('stroke-width',3);
  }
  svg.selectAll('.dot').data(weeks).join('circle').attr('cx',d=>x(d.week_label)+x.bandwidth()/2).attr('cy',d=>yL(pct(v(d.outcomes),v(d.conversations))||0)).attr('r',7).attr('fill',c[1]).attr('stroke','var(--bg)').attr('stroke-width',3);
  svg.selectAll('.dlbl').data(weeks).join('text').attr('x',d=>x(d.week_label)+x.bandwidth()/2).attr('y',d=>yL(pct(v(d.outcomes),v(d.conversations))||0)-14).attr('text-anchor','middle').attr('fill',c[1]).style('font-size','13px').style('font-weight','700').style('font-family','JetBrains Mono, monospace').text(d=>{const r=pct(v(d.outcomes),v(d.conversations)); return r!=null?r+'%':'';});

  const tip = document.createElement('div'); tip.className='tooltip'; el.appendChild(tip);
  svg.selectAll('rect,circle').on('pointerenter',(ev,d)=>{const r=pct(v(d.outcomes),v(d.conversations)); tip.innerHTML=`<b>${d.week_label}</b><br>${fmt(v(d.conversations))} conversations<br>${fmt(v(d.outcomes))} outcomes<br>${r!=null?r+'% outcome rate':'no data'}`; tip.style.display='block'; const b=el.getBoundingClientRect(); tip.style.left=(ev.clientX-b.left+14)+'px'; tip.style.top=(ev.clientY-b.top-44)+'px';}).on('pointerleave',()=>{tip.style.display='none';});

  document.getElementById('legend-main').innerHTML = `<div class="legend-item"><div class="legend-dot" style="background:${c[0]}"></div>Conversations</div><div class="legend-item"><div class="legend-dot" style="background:${c[1]}"></div>Outcome Rate</div><div class="legend-item"><div class="legend-dot" style="background:var(--warn)"></div>60% Target</div>`;
}

function renderIntentsChart(weeks) {
  const el = document.getElementById('chart-intents'); el.innerHTML = '';
  const series = [{key:'sermon_clicks',label:'Sermons'},{key:'life_groups',label:'Life Groups'},{key:'give',label:'Give'},{key:'events',label:'Events'}];
  const c = rc(), w = el.clientWidth || 700, h = 300;
  const m = { top: 30, right: 20, bottom: 50, left: 55 };
  const svg = d3.select(el).append('svg').attr('width', w).attr('height', h);
  const x0 = d3.scaleBand().domain(weeks.map(r=>r.week_label)).range([m.left,w-m.right]).padding(weeks.length<4?0.35:0.2);
  const x1 = d3.scaleBand().domain(series.map(s=>s.key)).range([0,Math.min(x0.bandwidth(),320)]).padding(0.1);
  const allV = weeks.flatMap(r=>series.map(s=>v(r[s.key])||0));
  const y = d3.scaleLinear().domain([0,d3.max(allV)*1.35||100]).range([h-m.bottom,m.top]);

  y.ticks(5).forEach(t=>svg.append('line').attr('x1',m.left).attr('x2',w-m.right).attr('y1',y(t)).attr('y2',y(t)).attr('stroke','var(--border)'));
  svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x0).tickSize(0)).selectAll('text').attr('fill','var(--fg3)').style('font-size','12px').style('font-weight','500');
  svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(5)).selectAll('text').attr('fill','var(--fg3)').style('font-size','11px');
  svg.selectAll('.domain').remove(); svg.selectAll('.tick line').attr('stroke','var(--border)');

  // Gradients for each series
  const defs = svg.append('defs');
  series.forEach((s,i)=>{const g=defs.append('linearGradient').attr('id','ig'+i).attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1'); g.append('stop').attr('offset','0%').attr('stop-color',c[i]).attr('stop-opacity',0.9); g.append('stop').attr('offset','100%').attr('stop-color',c[i]).attr('stop-opacity',0.45);});

  const groups = svg.selectAll('.wg').data(weeks).join('g').attr('transform',d=>`translate(${x0(d.week_label)},0)`);
  series.forEach((s,i)=>{
    groups.append('rect').attr('x',x1(s.key)).attr('y',d=>y(v(d[s.key])||0)).attr('width',x1.bandwidth()).attr('height',d=>h-m.bottom-y(v(d[s.key])||0)).attr('fill','url(#ig'+i+')').attr('rx',4);
    groups.append('text').attr('x',x1(s.key)+x1.bandwidth()/2).attr('y',d=>y(v(d[s.key])||0)-6).attr('text-anchor','middle').attr('fill',c[i]).style('font-size','10px').style('font-weight','700').style('font-family','JetBrains Mono, monospace').text(d=>v(d[s.key])||0);
  });

  const tip = document.createElement('div'); tip.className='tooltip'; el.appendChild(tip);
  groups.selectAll('rect').on('pointerenter',(ev,d)=>{tip.innerHTML=`<b>${d.week_label}</b><br>Sermons: ${fmt(v(d.sermon_clicks))}<br>Life Groups: ${fmt(v(d.life_groups))}<br>Give: ${fmt(v(d.give))}<br>Events: ${fmt(v(d.events))}`; tip.style.display='block'; const b=el.getBoundingClientRect(); tip.style.left=(ev.clientX-b.left+14)+'px'; tip.style.top=(ev.clientY-b.top-44)+'px';}).on('pointerleave',()=>{tip.style.display='none';});

  document.getElementById('legend-intents').innerHTML = series.map((s,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${c[i]}"></div>${s.label}</div>`).join('');
}

function renderFunnelChart(last) {
  const el = document.getElementById('chart-funnel'); el.innerHTML = '';
  const steps = [{label:'Visitors',val:v(last.visitors)},{label:'Widget Opens',val:v(last.widget_opens)},{label:'Conversations',val:v(last.conversations)},{label:'Outcomes',val:v(last.outcomes)}];
  const maxV = steps[0].val || 1;
  const c = rc();
  const gradients = [
    `linear-gradient(135deg, ${c[0]}, ${c[5]})`,
    `linear-gradient(135deg, ${c[5]}, ${c[1]})`,
    `linear-gradient(135deg, ${c[1]}, ${c[3]})`,
    `linear-gradient(135deg, ${c[3]}, ${c[4]})`
  ];
  el.innerHTML = steps.map((s,i)=>{
    const pctW = Math.max(12, (s.val / maxV) * 100);
    const convPct = i>0 ? Math.round((s.val / steps[i-1].val)*100) : 100;
    return `<div class="funnel-step">
      <div class="funnel-label">${s.label}</div>
      <div class="funnel-bar-wrap">
        <div class="funnel-bar" style="width:${pctW}%; background:${gradients[i]};">
          ${fmt(s.val)}
          <span class="funnel-pct">${i>0?convPct+'%':''}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderRatesChart(weeks) {
  const el = document.getElementById('chart-rates'); el.innerHTML = '';
  const c = rc(), w = el.clientWidth || 700, h = 280;
  const m = { top: 30, right: 20, bottom: 50, left: 55 };
  const svg = d3.select(el).append('svg').attr('width', w).attr('height', h);
  const x = d3.scaleBand().domain(weeks.map(r=>r.week_label)).range([m.left,w-m.right]).padding(weeks.length<4?0.6:0.2);
  const y = d3.scaleLinear().domain([0,100]).range([h-m.bottom,m.top]);

  y.ticks(5).forEach(t=>svg.append('line').attr('x1',m.left).attr('x2',w-m.right).attr('y1',y(t)).attr('y2',y(t)).attr('stroke','var(--border)'));
  svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x).tickSize(0)).selectAll('text').attr('fill','var(--fg3)').style('font-size','12px').style('font-weight','500');
  svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d=>d+'%')).selectAll('text').attr('fill','var(--fg3)').style('font-size','11px');
  svg.selectAll('.domain').remove(); svg.selectAll('.tick line').attr('stroke','var(--border)');

  const rates = [{key:'wo',label:'Widget Open Rate',fn:d=>pct(v(d.widget_opens),v(d.visitors)),ci:4},{key:'out',label:'Outcome Rate',fn:d=>pct(v(d.outcomes),v(d.conversations)),ci:1}];
  rates.forEach(r=>{
    if(weeks.length>1){const ln=d3.line().x(d=>x(d.week_label)+x.bandwidth()/2).y(d=>y(r.fn(d)||0)); svg.append('path').datum(weeks).attr('d',ln).attr('fill','none').attr('stroke',c[r.ci]).attr('stroke-width',3);}
    svg.selectAll('.dot-'+r.key).data(weeks).join('circle').attr('cx',d=>x(d.week_label)+x.bandwidth()/2).attr('cy',d=>y(r.fn(d)||0)).attr('r',7).attr('fill',c[r.ci]).attr('stroke','var(--bg)').attr('stroke-width',3);
    svg.selectAll('.lbl-'+r.key).data(weeks).join('text').attr('x',d=>x(d.week_label)+x.bandwidth()/2).attr('y',d=>y(r.fn(d)||0)-14).attr('text-anchor','middle').attr('fill',c[r.ci]).style('font-size','13px').style('font-weight','700').style('font-family','JetBrains Mono, monospace').text(d=>{const val=r.fn(d); return val!=null?val+'%':'';});
  });

  svg.append('line').attr('x1',m.left).attr('x2',w-m.right).attr('y1',y(60)).attr('y2',y(60)).attr('stroke','var(--warn)').attr('stroke-dasharray','8,4').attr('opacity',0.7);
  svg.append('line').attr('x1',m.left).attr('x2',w-m.right).attr('y1',y(50)).attr('y2',y(50)).attr('stroke','var(--fg3)').attr('stroke-dasharray','4,4').attr('opacity',0.3);

  document.getElementById('legend-rates').innerHTML = `<div class="legend-item"><div class="legend-dot" style="background:${c[4]}"></div>Widget Open Rate</div><div class="legend-item"><div class="legend-dot" style="background:${c[1]}"></div>Outcome Rate</div><div class="legend-item"><div class="legend-dot" style="background:var(--warn)"></div>60% Target</div>`;
}

function renderTopics(last) {
  const el = document.getElementById('chart-topics'); el.innerHTML = '';
  const topics = [
    {label:'Sermon access',val:v(last.sermon_topics)||0},
    {label:'Service time & location',val:v(last.service_time)||0},
    {label:'Event information',val:v(last.event_info)||0},
    {label:'Group & ministry',val:v(last.group_ministry)||0},
    {label:'Donation & giving',val:v(last.donation_giving)||0},
    {label:'Visit planning',val:v(last.visit_planning)||0},
    {label:'Event registration',val:v(last.event_registration)||0},
    {label:'Online access',val:v(last.online_access)||0},
    {label:'Staff contact',val:v(last.staff_contact)||0},
    {label:'Child attendance',val:v(last.child_attendance)||0},
  ].filter(t=>t.val>0).sort((a,b)=>b.val-a.val);
  const maxV = topics[0]?.val || 1;
  const total = topics.reduce((s,t)=>s+t.val,0);
  const c = rc();
  el.innerHTML = topics.map((t,i)=>{
    const pW = Math.max(8, (t.val/maxV)*100);
    const share = Math.round((t.val/total)*100);
    return `<div class="topic-row">
      <div class="topic-label">${t.label}</div>
      <div class="topic-track">
        <div class="topic-fill" style="width:${pW}%; background:linear-gradient(135deg, ${c[i%c.length]}, ${c[(i+1)%c.length]});">
          <span>${t.val}</span>
          <span class="topic-pct">${share}%</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderTable(weeks) {
  const cols = [{key:'week_label',label:'Week'},{key:'visitors',label:'Visitors'},{key:'widget_opens',label:'Widget Opens'},{key:'conversations',label:'Convos'},{key:'outcomes',label:'Outcomes'},{key:'_rate',label:'Rate',fn:d=>{const r=pct(v(d.outcomes),v(d.conversations)); return r!=null?r+'%':'—';}},{key:'sermon_clicks',label:'Sermons'},{key:'life_groups',label:'Groups'},{key:'give',label:'Give'},{key:'events',label:'Events'},{key:'notes',label:'Notes'}];
  const el = document.getElementById('data-table');
  el.innerHTML = `<thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>${[...weeks].reverse().map(r=>`<tr>${cols.map(c=>{const val=c.fn?c.fn(r):(typeof r[c.key]==='number'?fmt(r[c.key]):(r[c.key]||'')); const cls=c.key==='notes'?` class="notes-cell" title="${(r[c.key]||'').replace(/"/g,'&quot;')}"`:c.key==='week_label'?` style="font-family:Inter,sans-serif;font-weight:600;color:var(--fg)"`:``; return `<td${cls}>${val}</td>`;}).join('')}</tr>`).join('')}</tbody>`;
}

// Save
document.getElementById('save-btn').addEventListener('click',()=>{
  const week = document.getElementById('f-week').value;
  const msg = document.getElementById('save-msg');
  if(!week){msg.textContent='Pick a week start date.';return;}
  const row = {week, week_label:document.getElementById('f-label').value||week, visitors:v(document.getElementById('f-visitors').value), widget_opens:v(document.getElementById('f-widget').value), conversations:v(document.getElementById('f-convos').value), outcomes:v(document.getElementById('f-outcomes').value), sermon_clicks:v(document.getElementById('f-sermons').value), sermon_topics:v(document.getElementById('f-stopics').value), life_groups:v(document.getElementById('f-life').value), give:v(document.getElementById('f-give').value), events:v(document.getElementById('f-events').value), visit_planning:v(document.getElementById('f-visit').value), event_info:v(document.getElementById('f-eventinfo').value), service_time:v(document.getElementById('f-service').value), group_ministry:v(document.getElementById('f-group').value), staff_contact:v(document.getElementById('f-staff').value), child_attendance:v(document.getElementById('f-child').value), helpful_answered:v(document.getElementById('f-helpful-ans').value), helpful_asked:v(document.getElementById('f-helpful-ask').value), notes:document.getElementById('f-notes').value||null};
  const weeks = loadWeeks().filter(w=>w.week!==week);
  weeks.push(row); saveWeeks(weeks);
  msg.textContent='Saved!';
  document.querySelectorAll('.field input, .field textarea').forEach(f=>f.value='');
  setTimeout(()=>{msg.textContent='';},3000);
  render();
});

render();
window.addEventListener('resize', render);
</script>
